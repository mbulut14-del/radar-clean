name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache git \
            libltdl-dev libsqlite3-dev \
            libbz2-dev libreadline-dev

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Temizle
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -f build.log

      - name: Build APK
        id: build_apk
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Gercek hatayi ayikla
        if: failure()
        run: |
          echo "===== ILK KRITIK HATA SATIRLARI ====="
          grep -n -i -m 20 -E "traceback|exception|error:|parserexception|filenotfounderror|no such file|failed|kv.lang" build.log || true
          echo ""
          echo "===== SON 120 SATIR ====="
          tail -n 120 build.log || true

      - name: Build log upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: APK upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
