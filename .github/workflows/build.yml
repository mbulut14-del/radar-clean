name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repo cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache git \
            libltdl-dev libsqlite3-dev \
            libbz2-dev libreadline-dev \
            libtinfo5

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Temizle
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -f build.log

      - name: APK build
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Gercek hata satirlari
        if: failure()
        run: |
          echo "===== ILK KRITIK HATALAR ====="
          grep -niE "traceback|exception|error:|parserexception|filenotfounderror|no such file|failed|kv.lang" build.log | head -n 40 || true
          echo ""
          echo "===== SON 200 SATIR ====="
          tail -n 200 build.log || true

      - name: Build log yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: APK yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
